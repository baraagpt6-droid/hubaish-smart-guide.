name: Google Play Closed Testing
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, create a draft preview, or publish an explicitly approved draft
        type: choice
        options:
          - verify_only
          - preview_draft
          - publish_approved_release
        default: verify_only
        required: true
      expected_version_code:
        description: Exact existing versionCode to approve
        type: string
        required: false
        default: '0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: hubaish-google-play-closed-testing
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PLAY_PACKAGE_NAME: com.hubaish.guide
      PLAY_TRACK: Hubaish Closed Test
      PLAY_MODE: ${{ github.event_name == 'push' && 'preview_draft' || inputs.mode || 'verify_only' }}
    outputs:
      version_name: ${{ steps.play-release.outputs.version_name }}
      version_code: ${{ steps.play-release.outputs.version_code || steps.approved-release.outputs.version_code }}
      track: ${{ steps.play-release.outputs.track || env.PLAY_TRACK }}
      release_status: ${{ steps.publish-next-release.outputs.release_status || steps.publish-new-release.outputs.release_status || steps.approved-release.outputs.release_status || steps.play-release.outputs.release_status }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release mode and one-shot approval signal
        id: release-mode
        shell: bash
        env:
          INITIAL_PLAY_MODE: ${{ env.PLAY_MODE }}
          MANUAL_EXPECTED_VERSION_CODE: ${{ github.event.inputs.expected_version_code || '0' }}
        run: |
          set -euo pipefail
          mode="$INITIAL_PLAY_MODE"
          expected_code="$MANUAL_EXPECTED_VERSION_CODE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_code=""
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            if [[ "$commit_message" == *"[verify-only]"* ]]; then
              mode="verify_only"
              echo "Verify-only marker detected. Playwright and a disposable signed Gradle bundle will run; Google Play will not be read or written."
            else
              mode="preview_draft"
              if [[ -f ".publish-418" ]]; then
                before_sha="$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"
                [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::Push event did not provide a valid parent commit for the 418 one-shot marker."
                  exit 1
                }
                marker_value="$(tr -d '[:space:]' < .publish-418)"
                [[ "$marker_value" == "418" ]] || {
                  echo "::error::.publish-418 must contain exactly versionCode 418."
                  exit 1
                }
                if ! git cat-file -e "${before_sha}:.publish-418" 2>/dev/null; then
                  mode="publish_new_release"
                  expected_code="418"
                  echo "New .publish-418 marker detected. Build, sign, upload as draft, then promote only versionCode 418 on Hubaish Closed Test."
                fi
              fi
              if [[ "$mode" == "preview_draft" && -f ".publish-419" ]]; then
                before_sha="$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"
                [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::Push event did not provide a valid parent commit for the 419 one-shot marker."
                  exit 1
                }
                marker_value="$(tr -d '[:space:]' < .publish-419)"
                [[ "$marker_value" == "419" ]] || {
                  echo "::error::.publish-419 must contain exactly versionCode 419."
                  exit 1
                }
                if ! git cat-file -e "${before_sha}:.publish-419" 2>/dev/null; then
                  mode="publish_next_release"
                  expected_code="419"
                  echo "New .publish-419 marker detected. Build and sign 419, upload as draft, then promote only 419 on Hubaish Closed Test."
                fi
              fi
              if [[ "$mode" == "preview_draft" && ( -f ".promote-416" || -f ".promote-416-retry" || -f ".promote-416-final" ) ]]; then
                before_sha="$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"
                [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::Push event did not provide a valid parent commit."
                  exit 1
                }
                for marker_path in .promote-416 .promote-416-retry .promote-416-final; do
                  if [[ -f "$marker_path" ]]; then
                    marker_value="$(tr -d '[:space:]' < "$marker_path")"
                    [[ "$marker_value" == "416" ]] || {
                      echo "::error::$marker_path must contain exactly versionCode 416."
                      exit 1
                    }
                    if ! git cat-file -e "${before_sha}:${marker_path}" 2>/dev/null; then
                      mode="publish_approved_release"
                      expected_code="416"
                      echo "One-shot marker $marker_path was newly added by this push. AAB creation and upload will be skipped."
                      break
                    fi
                  fi
                done
              fi
            fi
          fi
          if [[ "$mode" == "publish_approved_release" || "$mode" == "publish_new_release" || "$mode" == "publish_next_release" ]]; then
            [[ "$expected_code" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::An explicit positive expected_version_code is required."
              exit 1
            }
          fi
          if [[ "$mode" == "publish_new_release" && "$expected_code" != "418" ]]; then
            echo "::error::The one-shot new-release path is locked to versionCode 418."
            exit 1
          fi
          if [[ "$mode" == "publish_next_release" && "$expected_code" != "419" ]]; then
            echo "::error::The one-shot next-release path is locked to versionCode 419."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "expected_version_code=$expected_code" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$mode; expected versionCode=${expected_code:-not applicable}."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate Play helpers on the approval-only path
        if: steps.release-mode.outputs.mode == 'publish_approved_release'
        run: python3 -m py_compile scripts/promote-play-draft.py scripts/monitor-play-status.py

      - name: Validate guarded 418 release helpers
        if: steps.release-mode.outputs.mode == 'publish_new_release'
        run: python3 -m py_compile scripts/resolve-play-release.py scripts/retire-obsolete-play-draft.py scripts/promote-play-draft.py scripts/monitor-play-status.py

      - name: Validate guarded 419 release helpers
        if: steps.release-mode.outputs.mode == 'publish_next_release'
        run: python3 -m py_compile scripts/resolve-play-release.py scripts/promote-play-draft.py scripts/monitor-play-status.py

      - name: Install icon rendering dependencies
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && grep -q "packages.microsoft.com" "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y python3-cairosvg python3-pil fonts-noto-core

      - name: Install app dependencies
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npm install --no-audit --no-fund

      - name: Generate PWA and Capacitor icon source images
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: python3 scripts/generate-icons.py

      - name: Run project build and verification
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npm run build

      - name: Install Playwright for app screenshots and feature graphic
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npx playwright install --with-deps chromium

      - name: Audit navigation, responsive layouts, offline cache and Cloudflare Worker
        timeout-minutes: 15
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: node scripts/audit-runtime.mjs

      - name: Render Arabic and English feature graphic
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: node scripts/render-play-feature-graphic.mjs

      - name: Generate Google Play listing graphics
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: python3 scripts/prepare-play-store-assets.py

      - name: Verify Play listing text and graphics
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: node scripts/verify-play-store.mjs

      - name: Capture actual app screens in Arabic and English
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: node scripts/capture-play-screenshots.mjs

      - name: Normalize screenshots to RGB PNG
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: python3 scripts/normalize-play-screenshots.py

      - name: Validate all Play phone screenshots
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: node scripts/verify-play-store.mjs --require-screenshots

      - name: Confirm target and existing upload-signing setup
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "baraagpt6-droid/hubaish-smart-guide." ]] || { echo "::error::Repository identity mismatch."; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Publishing is restricted to main."; exit 1; }
          [[ "$PLAY_PACKAGE_NAME" == "com.hubaish.guide" ]] || { echo "::error::Package ID mismatch."; exit 1; }
          [[ "$PLAY_TRACK" =~ ^[A-Za-z0-9][A-Za-z0-9_.\ -]{2,59}$ ]] || { echo "::error::PLAY_TRACK has an invalid name."; exit 1; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Required Android upload-signing secret is missing: $name"
              exit 1
            fi
          done
          echo "Repository, package, Closed-testing preference and all four upload-signing secrets are present."

      - name: Authenticate to Google Cloud using GitHub OIDC and WIF
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_approved_release' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: dalilna-play-automation-516000
          workload_identity_provider: projects/28058491662/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: dalilna-play-automation@dalilna-play-automation-516000.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Install Google Play API client dependencies
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_approved_release' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        run: python3 -m pip install --disable-pip-version-check "google-auth>=2.40,<3" "requests>=2.32,<3"

      - name: Discover actual Closed-testing track and next Play versionCode
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        id: play-release
        env:
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
          PLAY_RELEASE_MODE: ${{ steps.release-mode.outputs.mode }}
          PLAY_ALLOWED_EXISTING_DRAFT_VERSION_CODE: ${{ steps.release-mode.outputs.mode == 'publish_new_release' && '417' || '' }}
        run: python3 scripts/resolve-play-release.py

      - name: Publish the explicitly requested existing Closed-testing draft
        id: approved-release
        if: steps.release-mode.outputs.mode == 'publish_approved_release'
        env:
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
          PLAY_EXPECTED_VERSION_CODE: ${{ steps.release-mode.outputs.expected_version_code }}
        run: python3 scripts/promote-play-draft.py

      - name: Set up Ruby and Fastlane
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Java
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Create the Capacitor Android project
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npx cap add android

      - name: Generate native launcher and splash assets
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor Android
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: npx cap sync android

      - name: Patch Android app label and system bars
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: python3 scripts/patch-android-config.py

      - name: Apply generated app launcher icons
        if: steps.release-mode.outputs.mode != 'publish_approved_release'
        run: python3 scripts/apply-android-icons.py

      - name: Build and sign the Android App Bundle for Closed testing
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        id: signed-release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.play-release.outputs.version_code }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '[:space:]' < release-version.txt)"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-version.txt must be semantic version x.y.z"
            exit 1
          fi
          export ANDROID_VERSION_NAME="$VERSION_NAME"
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/keystore/hubaish-upload.jks"

          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["KEYSTORE_BASE64"].strip()
          lines = raw.splitlines()
          matches = [line for line in lines if line.split("=", 1)[0].strip() == "KEYSTORE_BASE64" and "=" in line]
          if matches:
              raw = matches[0].split("=", 1)[1]
          elif raw.split("=", 1)[0].strip() == "KEYSTORE_BASE64" and "=" in raw:
              raw = raw.split("=", 1)[1]
          raw = raw.strip().strip('"').strip("'")
          raw = re.sub(r"\s+", "", raw)
          raw += "=" * (-len(raw) % 4)
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit("KEYSTORE_BASE64 is not valid Base64.") from exc
          if not data.startswith(bytes.fromhex("feedfeed")):
              raise SystemExit("Expected the existing JKS upload keystore.")
          path = Path(os.environ["ANDROID_KEYSTORE_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          PY

          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          python3 scripts/prepare-android-release.py
          gradle_success=0
          for attempt in 1 2 3 4; do
            gradle_log="$RUNNER_TEMP/hubaish-gradle-bundle-$attempt.log"
            set +e
            (cd android && ./gradlew --no-daemon --console=plain bundleRelease) > "$gradle_log" 2>&1
            gradle_status=$?
            set -e
            cat "$gradle_log"
            if [[ "$gradle_status" -eq 0 ]]; then
              gradle_success=1
              break
            fi
            if ! grep -Eiq 'status code 429|HTTP 429|Too Many Requests' "$gradle_log"; then
              echo "::error::Gradle failed for a reason other than Maven Central rate limiting."
              exit "$gradle_status"
            fi
            if [[ "$attempt" -lt 4 ]]; then
              retry_delay=$((attempt * 20))
              echo "::warning::Maven Central rate-limited Android dependencies (HTTP 429). Waiting ${retry_delay}s before retry $((attempt + 1))/4."
              sleep "$retry_delay"
            fi
          done
          if [[ "$gradle_success" != "1" ]]; then
            echo "::error::Gradle remained rate-limited after 4 attempts. No AAB was uploaded."
            exit 1
          fi

          AAB_SOURCE="android/app/build/outputs/bundle/release/app-release.aab"
          [[ -s "$AAB_SOURCE" ]] || { echo "::error::Signed Release AAB was not produced."; exit 1; }
          jarsigner -verify "$AAB_SOURCE" >/dev/null
          keytool -printcert -jarfile "$AAB_SOURCE" > "$RUNNER_TEMP/aab-certificate.txt"

          python3 - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"], "aab-certificate.txt").read_text(encoding="utf-8", errors="replace")
          match = re.search(r"SHA256:\s*([0-9A-Fa-f:]{64,95})", report)
          if not match:
              raise SystemExit("Could not read the AAB signing certificate SHA-256 fingerprint.")
          bundle_fingerprint = match.group(1).replace(":", "").lower()
          command = [
              "keytool", "-exportcert",
              "-alias", os.environ["KEY_ALIAS"],
              "-keystore", os.environ["ANDROID_KEYSTORE_PATH"],
              "-storetype", "JKS",
              "-storepass", os.environ["KEYSTORE_PASSWORD"]
          ]
          exported = subprocess.run(command, check=True, capture_output=True).stdout
          keystore_fingerprint = hashlib.sha256(exported).hexdigest()
          if bundle_fingerprint != keystore_fingerprint:
              raise SystemExit(
                  "AAB signer does not match the existing Play upload keystore. "
                  f"AAB={bundle_fingerprint}, keystore={keystore_fingerprint}"
              )
          print("PASS: AAB is signed with the existing Play upload key.")
          PY

          mkdir -p release-out
          cp "$AAB_SOURCE" release-out/hubaish-smart-guide.aab
          AAB_SHA256="$(sha256sum release-out/hubaish-smart-guide.aab | awk '{print $1}')"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$AAB_SHA256" >> "$GITHUB_OUTPUT"
          echo "Signed AAB ready: versionName=$VERSION_NAME versionCode=$ANDROID_VERSION_CODE sha256=$AAB_SHA256"

      - name: Retire only the obsolete 417 draft after the clean 418 bundle is signed
        if: steps.release-mode.outputs.mode == 'publish_new_release'
        env:
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
          PLAY_OBSOLETE_DRAFT_VERSION_CODE: '417'
        run: python3 scripts/retire-obsolete-play-draft.py

      - name: Build a disposable signed Release AAB for verify-only runs
        if: steps.release-mode.outputs.mode == 'verify_only'
        id: verify-bundle
        shell: bash
        env:
          ANDROID_VERSION_CODE: '1'
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hubaish-verify-only.jks"
          export KEYSTORE_PASSWORD="temporary-verify-only-store"
          export KEY_ALIAS="hubaish-verify-only"
          export KEY_PASSWORD="temporary-verify-only-key"
          VERSION_NAME="$(tr -d '[:space:]' < release-version.txt)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release-version.txt (got '$VERSION_NAME')"; exit 1; }
          export ANDROID_VERSION_NAME="$VERSION_NAME"

          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE_PATH" -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" \
            -dname "CN=Hubaish Verify Only,O=Hubaish District,C=YE" -keyalg RSA -keysize 2048 -validity 2

          python3 scripts/prepare-android-release.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          mirror = re.compile(r'maven\s*\{\s*url\s*=\s*uri\("https://maven-central\.storage-download\.googleapis\.com/maven2/"\)\s*\}\s*mavenCentral\(\)')
          total = 0
          for path in Path("android").rglob("*.gradle"):
              source = path.read_text(encoding="utf-8")
              central_count = source.count("mavenCentral()")
              pairs = len(mirror.findall(source))
              if central_count and pairs != central_count:
                  raise SystemExit(f"Maven mirror is not configured before every Maven Central fallback in {path}.")
              total += pairs
          if total < 1:
              raise SystemExit("The generated Android Gradle files contain no verified Maven Central mirror pair.")
          print(f"PASS: {total} Google Maven mirror/fallback pairs verified.")
          PY

          gradle_success=0
          for attempt in 1 2 3 4; do
            gradle_log="$RUNNER_TEMP/hubaish-gradle-verify-$attempt.log"
            set +e
            (cd android && ./gradlew --no-daemon --console=plain bundleRelease) > "$gradle_log" 2>&1
            gradle_status=$?
            set -e
            cat "$gradle_log"
            if [[ "$gradle_status" -eq 0 ]]; then gradle_success=1; break; fi
            if ! grep -Eiq 'status code 429|HTTP 429|Too Many Requests' "$gradle_log"; then
              echo "::error::Gradle bundleRelease failed for a reason other than Maven rate limiting."
              exit "$gradle_status"
            fi
            if [[ "$attempt" -lt 4 ]]; then
              retry_delay=$((attempt * 20))
              echo "::warning::Maven mirror/fallback rate-limited the build. Waiting ${retry_delay}s before retry."
              sleep "$retry_delay"
            fi
          done
          [[ "$gradle_success" == "1" ]] || { echo "::error::Gradle remained rate-limited after four attempts."; exit 1; }

          AAB_SOURCE="android/app/build/outputs/bundle/release/app-release.aab"
          [[ -s "$AAB_SOURCE" ]] || { echo "::error::Release AAB was not produced."; exit 1; }
          jarsigner -verify "$AAB_SOURCE" >/dev/null
          mkdir -p release-out
          cp "$AAB_SOURCE" release-out/hubaish-smart-guide-verify.aab
          AAB_SHA256="$(sha256sum release-out/hubaish-smart-guide-verify.aab | awk '{print $1}')"
          echo "aab_sha256=$AAB_SHA256" >> "$GITHUB_OUTPUT"
          echo "PASS: Disposable verify-only AAB signed and verified; sha256=$AAB_SHA256"

      - name: Upload the verify-only AAB validation artifact
        if: steps.release-mode.outputs.mode == 'verify_only'
        uses: actions/upload-artifact@v7
        with:
          name: hubaish-play-verify-only
          path: release-out/hubaish-smart-guide-verify.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload the AAB and bilingual Play listing artifacts
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        uses: actions/upload-artifact@v7
        with:
          name: hubaish-play-closed-testing
          path: |
            release-out/hubaish-smart-guide.aab
            fastlane/metadata/android/ar/images/
            fastlane/metadata/android/en-US/images/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the signed AAB, listing, graphics and screenshots to Closed testing
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        env:
          AAB_PATH: release-out/hubaish-smart-guide.aab
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_RELEASE_STATUS: draft
          PLAY_PACKAGE_NAME: com.hubaish.guide
        run: bundle exec fastlane android upload_closed_testing

      - name: Verify the uploaded Closed-testing draft and protect Production
        if: steps.release-mode.outputs.mode == 'preview_draft' || steps.release-mode.outputs.mode == 'publish_new_release' || steps.release-mode.outputs.mode == 'publish_next_release'
        env:
          PLAY_PACKAGE_NAME: com.hubaish.guide
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_RELEASE_STATUS: draft
          ANDROID_VERSION_CODE: ${{ steps.play-release.outputs.version_code }}
          PLAY_PRODUCTION_VERSION_CODES: ${{ steps.play-release.outputs.production_version_codes }}
        run: python3 scripts/resolve-play-release.py --verify-upload

      - name: Promote the newly built 418 draft on the existing Closed Test track
        id: publish-new-release
        if: steps.release-mode.outputs.mode == 'publish_new_release'
        env:
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_EXPECTED_VERSION_CODE: ${{ steps.release-mode.outputs.expected_version_code }}
        run: |
          set -euo pipefail
          [[ "${{ steps.play-release.outputs.version_code }}" == "418" ]] || {
            echo "::error::Play resolver did not return the locked versionCode 418."
            exit 1
          }
          python3 scripts/promote-play-draft.py

      - name: Verify completed 418, zero pending drafts and unchanged Production
        if: steps.release-mode.outputs.mode == 'publish_new_release'
        env:
          PLAY_PACKAGE_NAME: com.hubaish.guide
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_RELEASE_STATUS: completed
          ANDROID_VERSION_CODE: ${{ steps.play-release.outputs.version_code }}
          PLAY_PRODUCTION_VERSION_CODES: ${{ steps.play-release.outputs.production_version_codes }}
        run: python3 scripts/resolve-play-release.py --verify-upload

      - name: Promote the newly built 419 draft on the existing Closed Test track
        id: publish-next-release
        if: steps.release-mode.outputs.mode == 'publish_next_release'
        env:
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_EXPECTED_VERSION_CODE: ${{ steps.release-mode.outputs.expected_version_code }}
        run: |
          set -euo pipefail
          [[ "${{ steps.play-release.outputs.version_code }}" == "419" ]] || {
            echo "::error::Play resolver did not return the locked versionCode 419."
            exit 1
          }
          python3 scripts/promote-play-draft.py

      - name: Verify completed 419, zero pending drafts and unchanged Production
        if: steps.release-mode.outputs.mode == 'publish_next_release'
        env:
          PLAY_PACKAGE_NAME: com.hubaish.guide
          PLAY_TRACK: ${{ steps.play-release.outputs.track }}
          PLAY_RELEASE_STATUS: completed
          ANDROID_VERSION_CODE: ${{ steps.play-release.outputs.version_code }}
          PLAY_PRODUCTION_VERSION_CODES: ${{ steps.play-release.outputs.production_version_codes }}
        run: python3 scripts/resolve-play-release.py --verify-upload



      - name: Publish the result summary
        if: success()
        shell: bash
        env:
          PLAY_MODE: ${{ steps.release-mode.outputs.mode }}
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
          PLAY_VERSION_NAME: ${{ steps.play-release.outputs.version_name }}
          PLAY_VERSION_CODE: ${{ steps.play-release.outputs.version_code || steps.approved-release.outputs.version_code }}
          PLAY_RELEASE_STATUS: ${{ steps.publish-next-release.outputs.release_status || steps.publish-new-release.outputs.release_status || steps.approved-release.outputs.release_status || steps.play-release.outputs.release_status || 'draft' }}
          AAB_SHA256: ${{ steps.signed-release.outputs.aab_sha256 || steps.verify-bundle.outputs.aab_sha256 }}
        run: |
          {
            echo "## Hubaish Google Play — Closed Testing"
            echo
            echo "- Package: $PLAY_PACKAGE_NAME"
            if [[ "$PLAY_MODE" == "preview_draft" ]]; then
              echo "- Result: **Upload and read-back verification passed**"
              echo "- Track: \`$PLAY_TRACK\`"
              echo "- Version: \`$PLAY_VERSION_NAME\`"
              echo "- versionCode: \`$PLAY_VERSION_CODE\`"
              echo "- Release status: **$PLAY_RELEASE_STATUS**"
              echo "- AAB SHA-256: \`$AAB_SHA256\`"
              echo "- Production track changed: **No — verified unchanged**"
              echo "- Review gate: **Draft only** — this upload is not published to testers until the separate manual approval action."
            elif [[ "$PLAY_MODE" == "publish_new_release" ]]; then
              echo "- Result: clean AAB built, uploaded as a draft, promoted and verified by fresh Google Play API read-back."
              echo "- Track: `$PLAY_TRACK`"
              echo "- Version: `$PLAY_VERSION_NAME`"
              echo "- versionCode: `$PLAY_VERSION_CODE`"
              echo "- Release status: **$PLAY_RELEASE_STATUS**"
              echo "- AAB SHA-256: `$AAB_SHA256`"
              echo "- Superseded draft 417 removed before upload: **Yes**"
              echo "- Pending versioned drafts after promotion: **0**"
              echo "- Production versionCodes: **0 — verified unchanged**"
              echo "- Tester list and tester configuration: **not accessed or modified**"
            elif [[ "$PLAY_MODE" == "publish_next_release" ]]; then
              echo "- Result: clean 419 AAB built, uploaded as a draft, promoted and verified by fresh Google Play API read-back."
              echo "- Track: `$PLAY_TRACK`"
              echo "- Version: `$PLAY_VERSION_NAME`"
              echo "- versionCode: `$PLAY_VERSION_CODE`"
              echo "- Release status: **$PLAY_RELEASE_STATUS**"
              echo "- AAB SHA-256: `$AAB_SHA256`"
              echo "- Replaced prior completed versionCode 418 on the same track: **Yes**"
              echo "- Pending versioned drafts after promotion: **0**"
              echo "- Production versionCodes: **0 — verified unchanged**"
              echo "- Tester list and tester configuration: **not accessed or modified**"
            elif [[ "$PLAY_MODE" == "publish_approved_release" ]]; then
              echo "- Result: requested Closed-testing draft promoted and verified by a fresh API read-back."
              echo "- Track: \`$PLAY_TRACK\`"
              echo "- versionCode: \`$PLAY_VERSION_CODE\`"
              echo "- Release status: **$PLAY_RELEASE_STATUS**"
              echo "- AAB built or uploaded: **No**"
              echo "- Production track changed: **No — not accessed**"
            else
              echo "- Result: verification-only build succeeded. A disposable Release AAB was signed for validation; no Google Play API release write or upload was attempted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
