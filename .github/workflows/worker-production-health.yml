name: Cloudflare Worker Production Health

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hubaish-worker-production-health
  cancel-in-progress: true

jobs:
  production-health:
    name: Verify live Worker, KV, GitHub and first-admin state
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production endpoints
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://hubaish-cms.baraag6.workers.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getJson(path) {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, {
                  headers: { Accept: 'application/json' },
                  signal: AbortSignal.timeout(15000),
                  cache: 'no-store'
                });
                const raw = await response.text();
                let body;
                try { body = raw ? JSON.parse(raw) : {}; }
                catch { throw new Error(path + ' returned non-JSON HTTP ' + response.status + ': ' + raw.slice(0, 300)); }
                console.log('\n' + path + ' — HTTP ' + response.status);
                console.log(JSON.stringify(body, null, 2));
                return { status: response.status, ok: response.ok, body };
              } catch (error) {
                lastError = error;
                console.error('Attempt ' + attempt + '/3 failed: ' + error.message);
                if (attempt < 3) await sleep(5000);
              }
            }
            throw lastError;
          }

          (async () => {
            const healthResult = await getJson('/api/health');
            const setupResult = await getJson('/setup/status');
            const failures = [];

            if (!healthResult.ok || healthResult.body.ok !== true) {
              for (const key of ['kv', 'githubContentsRead', 'sessionSecret']) {
                if (healthResult.body.checks?.[key]?.ok !== true) {
                  failures.push(key + ': ' + (healthResult.body.checks?.[key]?.error || 'not ok'));
                }
              }
              if (!failures.length) failures.push('/api/health returned HTTP ' + healthResult.status);
            }

            if (!setupResult.ok) {
              failures.push('/setup/status returned HTTP ' + setupResult.status + ': ' + (setupResult.body.error || 'request failed'));
            } else {
              if (typeof setupResult.body.setupRequired !== 'boolean') {
                failures.push('setupRequired is missing or is not a boolean.');
              } else if (setupResult.body.setupRequired === true && setupResult.body.bootstrapKeyConfigured !== true) {
                failures.push('First-admin setup is pending, but BOOTSTRAP_KEY is not configured.');
              } else if (setupResult.body.setupRequired === false && setupResult.body.bootstrapKeyConfigured !== false) {
                failures.push('An administrator already exists; remove BOOTSTRAP_KEY from Worker Secrets.');
              }
            }

            if (failures.length) throw new Error('Production readiness failures:\n- ' + failures.join('\n- '));
            console.log('\nPASS: Worker health, KV, GitHub read, session secret and first-admin lifecycle state are consistent.');
          })().catch(error => {
            console.error('\nFAIL: ' + error.message);
            process.exitCode = 1;
          });
          NODE
