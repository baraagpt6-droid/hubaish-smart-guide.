name: Build Android APK and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubaish-guide-deploy-worker-url-fix
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG icon renderer
        run: sudo apt-get update && sudo apt-get install -y python3-cairosvg python3-pil
      - name: Generate PWA and favicon icons
        run: python3 scripts/generate-icons.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

  deploy-website:
    needs: build-website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      version_name: ${{ steps.apk.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG icon renderer
        run: sudo apt-get update && sudo apt-get install -y python3-cairosvg python3-pil
      - name: Generate PWA and favicon icons
        run: python3 scripts/generate-icons.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify website
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate native icons and splash screens
        run: npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Patch Android app label and status-bar layout
        run: python3 scripts/patch-android-config.py
      - name: Set Android version and build signed APK and AAB
        id: apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '[:space:]' < release-version.txt)"
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-version.txt must contain a semantic version such as 1.0.400"
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          export VERSION_NAME
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          code = os.environ["GITHUB_RUN_NUMBER"]
          source, code_count = re.subn(r"(?m)^(\s*versionCode\s*(?:=\s*)?).+$", lambda m: m.group(1) + code, source, count=1)
          version_name = os.environ["VERSION_NAME"]
          source, name_count = re.subn(r'(?m)^(\s*versionName\s*(?:=\s*)?).+$', lambda m: m.group(1) + '"' + version_name + '"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName.")
          gradle.write_text(source)
          PY
          mkdir -p release-out
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            mkdir -p android/keystore
            python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ["KEYSTORE_BASE64"].strip()
          lines = raw.splitlines()
          matches = [line for line in lines if line.split("=", 1)[0].strip() == "KEYSTORE_BASE64" and "=" in line]
          if matches:
              raw = matches[0].split("=", 1)[1]
          elif raw.split("=", 1)[0].strip() == "KEYSTORE_BASE64" and "=" in raw:
              raw = raw.split("=", 1)[1]
          raw = raw.strip().strip('"').strip("'")
          raw = re.sub(r"\s+", "", raw)
          raw += "=" * (-len(raw) % 4)
          try:
              decoded = base64.b64decode(raw, validate=True)
          except Exception:
              raise SystemExit("KEYSTORE_BASE64 is not valid Base64.")
          if not decoded.startswith(bytes.fromhex("feedfeed")):
              raise SystemExit("Decoded keystore is not a valid JKS file.")
          Path("android/keystore/hubaish-release.jks").write_bytes(decoded)
          PY
            keytool -list -keystore android/keystore/hubaish-release.jks -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/keystore/hubaish-release.jks"
            python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          signing = '''
              signingConfigs {
                  hubaishRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storeType "JKS"
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.hubaishRelease
                      minifyEnabled false
                  }
              }
          '''
          marker = "android {"
          if marker not in text:
              raise SystemExit("Android Gradle configuration block not found.")
          text = text.replace(marker, marker + signing, 1)
          gradle.write_text(text)
          PY
            (cd android && ./gradlew --no-daemon assembleRelease bundleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk "release-out/Daleel-Hubaish-v${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "release-out/Daleel-Hubaish-v${VERSION_NAME}.aab"
            cp android/app/build/outputs/bundle/release/app-release.aab "release-out/Daleel-Hubaish-release.aab"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Built signed APK and AAB with the persistent release keystore."
          else
            if [[ -n "${KEYSTORE_BASE64}" || -n "${KEYSTORE_PASSWORD}" || -n "${KEY_ALIAS}" || -n "${KEY_PASSWORD}" ]]; then
              echo "::error::Signing secrets are only partially configured."
              exit 1
            fi
            echo "::warning::Signing secrets are not configured. Only a debug APK can be built."
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "release-out/Daleel-Hubaish-v${VERSION_NAME}-debug.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daleel-hubaish-android
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: needs.build-android.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daleel-hubaish-android
          path: ./release
      - name: Publish signed Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Daleel Hubaish Smart Guide ${{ needs.build-android.outputs.version_name }}
          generate_release_notes: true
          files: release/*
