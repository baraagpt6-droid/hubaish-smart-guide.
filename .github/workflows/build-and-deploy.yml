name: Build Android APK and deploy GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubaish-guide-deploy
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./www
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify website
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hubaish-smart-guide.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hubaish-smart-guide-apk
          path: hubaish-smart-guide.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hubaish-smart-guide-apk
          path: ./release
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Hubaish Smart Guide ${{ github.ref_name }}
          generate_release_notes: true
          files: release/hubaish-smart-guide.apk
