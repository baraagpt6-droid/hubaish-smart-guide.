name: Verify Cloudflare Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubaish-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    name: Deploy when credentials exist; always verify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare setup script syntax
        run: node --check scripts/configure-cloudflare-kv.mjs

      - name: Validate the fixed hubaish-admins ADMINS binding
        run: node scripts/configure-cloudflare-kv.mjs

      - name: Deploy hubaish-cms with the ADMINS binding
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-worker/wrangler.toml

      - name: Skip deployment because Cloudflare credentials are not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured."
          echo "Continuing with live production health checks. No credentials are printed or modified."

      - name: Verify live production /health and /setup/status
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://hubaish-cms.baraagpt6.workers.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function check(path) {
            let lastError;
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const response = await fetch(base + path, {
                  headers: { Accept: 'application/json' },
                  cache: 'no-store',
                  signal: AbortSignal.timeout(15000)
                });
                const raw = await response.text();
                let body;
                try {
                  body = raw ? JSON.parse(raw) : {};
                } catch {
                  throw new Error(path + ' returned non-JSON HTTP ' + response.status);
                }

                console.log(path + ' — HTTP ' + response.status);
                console.log(JSON.stringify(body, null, 2));

                if (response.status !== 200) {
                  throw new Error(path + ' must return HTTP 200; received ' + response.status);
                }
                return { response, body };
              } catch (error) {
                lastError = error;
                console.error('Attempt ' + attempt + '/6: ' + error.message);
              }
              if (attempt < 6) await sleep(5000);
            }
            throw lastError || new Error(path + ' failed');
          }

          (async () => {
            const health = await check('/health');
            if (health.body.ok !== true) {
              throw new Error('/health returned HTTP 200 but ok was not true');
            }
            for (const key of ['kv', 'githubContentsRead', 'sessionSecret']) {
              if (health.body.checks?.[key]?.ok !== true) {
                throw new Error('/health check failed for ' + key + ': ' +
                  (health.body.checks?.[key]?.error || 'check missing or not ok'));
              }
            }

            const setup = await check('/setup/status');
            if (typeof setup.body.setupRequired !== 'boolean') {
              throw new Error('/setup/status returned HTTP 200 but setupRequired was invalid');
            }

            console.log('PASS: production /health and /setup/status both returned HTTP 200.');
            console.log('PASS: health, ADMINS KV, GitHub CMS read, and SESSION_SECRET checks passed.');
          })().catch(error => {
            console.error('FAIL: ' + error.message);
            process.exitCode = 1;
          });
          NODE
