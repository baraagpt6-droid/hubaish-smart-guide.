name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hubaish-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Resolve ADMINS KV, deploy Worker and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the hubaish-admins KV namespace and write Wrangler binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/configure-cloudflare-kv.mjs
      - name: Check Cloudflare setup script syntax
        run: node --check scripts/configure-cloudflare-kv.mjs
      - name: Deploy hubaish-cms with the ADMINS binding
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-worker/wrangler.toml
      - name: Verify production health and ADMINS connectivity
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://hubaish-cms.baraagpt6.workers.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function check(path) {
            let last;
            for (let attempt = 1; attempt <= 6; attempt++) {
              try {
                const response = await fetch(base + path, {
                  headers: { Accept: 'application/json' },
                  cache: 'no-store',
                  signal: AbortSignal.timeout(15000)
                });
                const raw = await response.text();
                let body;
                try { body = raw ? JSON.parse(raw) : {}; }
                catch { throw new Error(path + ' returned non-JSON HTTP ' + response.status); }
                console.log(path + ' — HTTP ' + response.status);
                console.log(JSON.stringify(body, null, 2));
                if (response.ok) return { response, body };
                last = new Error(path + ' returned HTTP ' + response.status);
              } catch (error) {
                last = error;
                console.error('Attempt ' + attempt + '/6: ' + error.message);
              }
              if (attempt < 6) await sleep(5000);
            }
            throw last || new Error(path + ' failed');
          }
          (async () => {
            const health = await check('/health');
            for (const key of ['kv', 'githubContentsRead', 'sessionSecret']) {
              if (health.body.checks?.[key]?.ok !== true) {
                throw new Error('/health check failed for ' + key + ': ' + (health.body.checks?.[key]?.error || 'not ok'));
              }
            }
            if (health.response.status !== 200 || health.body.ok !== true) {
              throw new Error('/health did not return HTTP 200 with ok=true');
            }
            const setup = await check('/setup/status');
            if (typeof setup.body.setupRequired !== 'boolean') {
              throw new Error('/setup/status did not return a valid setupRequired flag');
            }
            console.log('PASS: Production /health is HTTP 200; ADMINS KV read/write/delete, GitHub CMS read and SESSION_SECRET checks passed.');
          })().catch(error => {
            console.error('FAIL: ' + error.message);
            process.exitCode = 1;
          });
          NODE
